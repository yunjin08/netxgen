[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# Each function declares its own `export const config = { path: '/api/...' }`,
# which Netlify maps to the function automatically. SPA fallback below.

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888
  autoLaunch = false

[functions]
  node_bundler = "esbuild"
  included_files = ["netlify/functions/_shared/**"]
